name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airBnbApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Includes MySqlSchemaTest: GitHub's runners have Docker, so Testcontainers runs against real MySQL
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: airBnbApp/target/surefire-reports/

  frontend:
    name: Frontend (tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airbnb-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node/npm as development: npm 10 and 11 disagree on optional entries in package-lock.json
          node-version-file: airbnb-frontend/.nvmrc
          cache: npm
          cache-dependency-path: airbnb-frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --watchAll=false
      # CI=true (set by GitHub Actions) makes the build fail on any lint warning
      - name: Production build
        run: npm run build

  docker:
    name: Docker (full stack smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through the frontend's nginx proxy
        run: |
          set -euo pipefail
          base=http://localhost:3000
          curl -fsS "$base/" | grep -q '<div id="root">'
          # client-side routes fall back to index.html
          curl -fsS "$base/hotels/1" | grep -q '<div id="root">'
          curl -fsS "$base/api/v1/actuator/health" | grep -q '"UP"'
          start=$(date -d '+10 days' +%F); end=$(date -d '+12 days' +%F)
          curl -fsS -X POST "$base/api/v1/hotels/search" -H 'Content-Type: application/json' \
            -d "{\"city\":\"goa\",\"startDate\":\"$start\",\"endDate\":\"$end\",\"roomsCount\":1}" \
            | grep -q 'Sea Breeze Resort'
          curl -fsS -X POST "$base/api/v1/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"guest@demo.com","password":"password123"}' | grep -q '"token"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
