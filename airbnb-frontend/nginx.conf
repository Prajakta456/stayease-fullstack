server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls are proxied to the backend container: one origin for the browser, so no CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Build assets have content hashes in their names, so they can be cached for a long time
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Client-side routes (/hotels/1, /bookings, ...) all load the app; index.html itself is never cached
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
