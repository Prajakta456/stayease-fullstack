# Production profile: SPRING_PROFILES_ACTIVE=prod. Everything environment-specific still comes from
# environment variables (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, ...).

# Refuse to start without a real signing key instead of falling back to a random one
jwt.require-secret=true

# API docs are off unless explicitly enabled
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Never include internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
