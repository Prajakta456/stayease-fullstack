spring.application.name=airBnbApp

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ✅ FIXED: was declared twice — first `update` then `create-drop` which WIPES data on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# The H2 web console allows arbitrary SQL (and code execution) — never expose it
spring.h2.console.enabled=false

server.servlet.context-path=/api/v1

# JWT signing key: at least 32 bytes. If unset, a random key is generated at startup
# (fine for local dev, but every restart logs everyone out). Always set it in production.
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Brute-force protection for /auth endpoints (fixed windows, per client IP and per email)
security.rate-limit.login-per-ip-per-minute=10
security.rate-limit.login-per-email-per-minute=5
security.rate-limit.signup-per-ip-per-hour=10
