spring.application.name=stayease

# Local settings (database credentials, JWT secret, ...) are read from an optional,
# git-ignored .env file in the directory the backend is started from. See .env.example.
spring.config.import=optional:file:.env[.properties]

# MySQL. Defaults match db/create-local-database.sql; override with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/airbnb}
spring.datasource.username=${DB_USERNAME:airbnb_app}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Creates demo accounts and hotels on startup when the database is empty (local development only)
app.seed-demo-data=${SEED_DEMO_DATA:false}

server.servlet.context-path=/api/v1

# JWT signing key: at least 32 bytes. If unset, a random key is generated at startup
# (fine for local dev, but every restart logs everyone out). Always set it in production.
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Brute-force protection for /auth endpoints (fixed windows, per client IP and per email)
security.rate-limit.login-per-ip-per-minute=10
security.rate-limit.login-per-email-per-minute=5
security.rate-limit.signup-per-ip-per-hour=10

# How long rooms stay held for an unpaid booking, and how often expired holds are released
booking.hold-minutes=10
booking.expiry-check-interval-ms=60000

# Recurring public holidays (MM-dd) that get the holiday surcharge
pricing.holidays=01-26,08-15,10-02,12-25

# Every lazy association is loaded inside a service transaction; never hold a DB session for the whole HTTP request
spring.jpa.open-in-view=false

# OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui/index.html); set API_DOCS_ENABLED=false to hide them
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
