# Fast in-memory database for the integration tests (activated with @ActiveProfiles("test")).
# The real MySQL schema and Flyway migrations are covered by MySqlSchemaIT, which uses Testcontainers.
spring.datasource.url=jdbc:h2:mem:airbnb-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
app.seed-demo-data=false
