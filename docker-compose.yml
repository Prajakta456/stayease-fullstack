# The whole app in containers:
#   docker compose up --build        -> http://localhost:3000 (sign in as guest@demo.com / password123)
# Only the database, for running the backend and frontend from source:
#   docker compose up -d db          -> MySQL on localhost:3307 (see airBnbApp/.env.example)
#
# The passwords and JWT secret below are development defaults; override them with environment
# variables (e.g. JWT_SECRET=... docker compose up) and never use them for a real deployment.

services:
  db:
    image: mysql:8.4
    container_name: airbnb-mysql
    environment:
      MYSQL_DATABASE: airbnb
      MYSQL_USER: airbnb_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-airbnb_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./airBnbApp
    container_name: airbnb-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/airbnb
      DB_USERNAME: airbnb_app
      DB_PASSWORD: ${DB_PASSWORD:-airbnb_dev_password}
      JWT_SECRET: ${JWT_SECRET:-docker-compose-development-secret-change-me}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      # Direct API access, e.g. Swagger UI at http://localhost:8080/api/v1/swagger-ui/index.html
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./airbnb-frontend
      args:
        REACT_APP_API_URL: /api/v1
        REACT_APP_SHOW_DEMO_LOGINS: "true"
    container_name: airbnb-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
